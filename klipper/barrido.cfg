# =====================================================================
#  ad5x-barrido-cama · barrido.cfg
#  Barrido automático de la cama para Flashforge AD5X con ZMOD y la cola
#  de trabajos de Moonraker. Al terminar cada impresión, la impresora
#  enfría la cama, coge una espátula de un soporte abatible, empuja las
#  piezas fuera de la cama y lanza la siguiente impresión.
#
#  - Barre a ras de cama piezas de hasta ALTURA_MAX mm (80). Hasta
#    ALTURA_TOPE (150), primero con la cama más baja y luego a ras de cama.
#  - Detecta piezas pegadas con la báscula de la cama: reintenta y, si no
#    se despegan, deja la espátula y PAUSA la cola.
#  - Al reanudar la cola Moonraker no vuelve a barrer.
#
#  Instalación: ver README.md (https://github.com/devcheny/ad5x-barrido-cama/)
#    mod_data/user.cfg  ->  [include servo.cfg]
#                           [include barrido.cfg]
#
#  Los valores de COGER_ESPATULA (dock_x, dock_y) y de _PUERTA (ángulos)
#  son los de mi impresora: hay que calibrarlos en la tuya.
# =====================================================================

[gcode_macro GUARDAR_ALTURA]
description: La llama el slicer al final de la impresión con la altura máxima y el material
variable_a_mano: "TPU"            # materiales que no se barren: se retiran a mano
variable_lentos: "PETG,PCTG"      # materiales muy pegados: se empujan despacio (más fuerza del motor)
gcode:
  {% set v = printer["gcode_macro GUARDAR_ALTURA"] %}
  {% set h = params.H|default(-1)|float %}
  {% set m = params.MAT|default("")|string|upper %}
  {% set manual = 1 if m and m in v.a_mano.split(",") else 0 %}
  {% set lento = 1 if m and m in v.lentos.split(",") else 0 %}
  SET_GCODE_VARIABLE MACRO=BARRER_CAMA VARIABLE=altura VALUE={h}
  SET_GCODE_VARIABLE MACRO=BARRER_CAMA VARIABLE=a_mano VALUE={manual}
  SET_GCODE_VARIABLE MACRO=BARRER_CAMA VARIABLE=lento VALUE={lento}
  # Zona de las piezas: se guarda ahora porque ZMOD borra los objetos al terminar la impresión
  {% set ns = namespace(x0=9999.0, x1=-9999.0, y0=9999.0, y1=-9999.0, area=0.0) %}
  {% for obj in printer.exclude_object.objects %}
    {% set o = namespace(x0=9999.0, x1=-9999.0, y0=9999.0, y1=-9999.0) %}
    {% for p in obj.polygon %}
      {% set o.x0 = [o.x0, p[0]|float]|min %}
      {% set o.x1 = [o.x1, p[0]|float]|max %}
      {% set o.y0 = [o.y0, p[1]|float]|min %}
      {% set o.y1 = [o.y1, p[1]|float]|max %}
    {% endfor %}
    {% set ns.area = [ns.area, (o.x1 - o.x0) * (o.y1 - o.y0)]|max %}
    {% set ns.x0 = [ns.x0, o.x0]|min %}
    {% set ns.x1 = [ns.x1, o.x1]|max %}
    {% set ns.y1 = [ns.y1, o.y1]|max %}
  {% endfor %}
  SET_GCODE_VARIABLE MACRO=BARRER_CAMA VARIABLE=obj_area VALUE={ns.area}
  SET_GCODE_VARIABLE MACRO=BARRER_CAMA VARIABLE=obj_x0 VALUE={ns.x0}
  SET_GCODE_VARIABLE MACRO=BARRER_CAMA VARIABLE=obj_x1 VALUE={ns.x1}
  SET_GCODE_VARIABLE MACRO=BARRER_CAMA VARIABLE=obj_y1 VALUE={ns.y1}
  RESPOND MSG="Altura de la impresión guardada: {h} mm, material: {m if m else 'desconocido'}{' (se retira a mano)' if manual else ''}{' (empuje lento)' if lento else ''}"

[gcode_macro BARRER_CAMA]
description: Enfría la cama, coge la espátula y barre las piezas bajas hacia el frente
variable_altura: -1.0
variable_a_mano: 0
variable_lento: 0
variable_obj_x0: 9999.0
variable_obj_x1: -9999.0
variable_obj_y1: -9999.0
variable_obj_area: 0.0
gcode:
  # ---------------- AJUSTES (puedes pasarlos como parámetros) ----------
  {% set ALTURA_MAX = params.ALTURA_MAX|default(80)|float %}  # mm que caben bajo el puente delantero (pantalla) barriendo a ras de cama
  {% set ALTURA_TOPE = params.ALTURA_TOPE|default(150)|float %} # mm, piezas más altas -> a mano. Entre ALTURA_MAX y esto: primero barre
                                                              # con la cama más baja (lo que sobra de ALTURA_MAX) y luego a ras de cama
  {% set Z_BARRIDO  = params.Z_BARRIDO|default(0.5)|float %}  # altura del filo sobre la cama al empujar
  {% set TEMP_CAMA  = params.TEMP_CAMA|default(28)|float %}   # barre cuando la cama baje de aquí
  {% set FILO       = params.FILO|default(13)|float %}        # mm que el filo queda por debajo de la boquilla (Z 13,5 = a ras de cama)
  {% set ESP_DX     = params.ESP_DX|default(5)|float %}       # X del centro de la espátula menos X de la boquilla
  {% set ESP_DY     = params.ESP_DY|default(37.5)|float %}    # mm que la cara de empuje va por delante de la boquilla
  {% set Y_MAX      = params.Y_MAX|default(225)|float %}      # Y máxima de la boquilla con la espátula puesta (en Y 228 choca con la papelera)
  {% set Y_LATERAL  = params.Y_LATERAL|default(220)|float %}  # Y máxima para moverse en X: más atrás engancha la palanca de la papelera
  {% set X_HOME     = params.X_HOME|default(115)|float %}     # X mínima de la boquilla para hacer home con la espátula (lejos de la palanca)
  {% set ANCHO      = params.ANCHO|default(65)|float %}       # ancho de la espátula
  {% set SOLAPE     = params.SOLAPE|default(8)|float %}       # solape entre pasadas
  {% set Y_FINAL    = params.Y_FINAL|default(10)|float %}     # Y de la boquilla al terminar (en Y 10 las piezas ya han caído)
  {% set X_BOQ_MIN  = params.X_BOQ_MIN|default(0)|float %}    # X mínima de la boquilla al barrer
  {% set X_BOQ_MAX  = params.X_BOQ_MAX|default(185 if printer["gcode_macro _PUERTA"].servo else 155)|float %}  # X máx. de la boquilla: 155 con el soporte fijo; con la puerta plegada, toda la cama
  {% set VEL        = params.VEL|default(300 if printer["gcode_macro BARRER_CAMA"].lento else 900)|float %}  # mm/min al empujar: 15 mm/s; 5 mm/s con PETG
  {% set MALLA      = params.MALLA|default("auto") %}         # perfil de malla a usar al barrer
  {% set MARGEN     = params.MARGEN|default(15)|float %}      # mm extra a cada lado de las piezas
  {% set REHOME     = params.REHOME|default(1)|int %}         # 1 = home tras cada pasada (recupera pasos perdidos)
  {% set REHOME_X   = params.REHOME_X|default(1)|int %}       # 1 = también X (probar antes con TEST_HOME_ESPATULA)
  {% set TRAMO      = params.TRAMO|default(5)|float %}        # mm por tramo de empuje (se lee la báscula entre tramos)
  {% set UMBRAL     = params.UMBRAL|default(300)|float %}     # subida de la báscula que se considera atasco (reposo ~57, pieza pegada ~900); 0 = solo registrar
  {% set INTENTOS   = params.INTENTOS|default(3)|int %}       # intentos por pasada si la pieza no se despega
  {% set ESPERA     = params.ESPERA|default(300)|int %}       # s de espera antes de reintentar (la cama sigue enfriándose)
  # ---------------------------------------------------------------------
  {% set h = printer["gcode_macro BARRER_CAMA"].altura|float %}

  {% if printer["gcode_macro BARRER_CAMA"].a_mano %}
    {action_raise_error("BARRER_CAMA: este material se pega demasiado a la cama para barrerlo. Retira la pieza a mano y reanuda la cola.")}
  {% elif h < 0 %}
    {action_raise_error("BARRER_CAMA: altura desconocida (falta GUARDAR_ALTURA en el G-code final). Retira la pieza y reanuda la cola.")}
  {% elif h > ALTURA_TOPE %}
    {action_raise_error("BARRER_CAMA: la pieza mide %.1f mm (máximo %.1f). Retírala a mano y reanuda la cola." % (h, ALTURA_TOPE))}
  {% endif %}

  {% set Z_BAR = Z_BARRIDO + FILO %}                  # Z de la boquilla al empujar
  {% set EXTRA = [h - ALTURA_MAX, 0]|max %}           # pieza alta: cuánto más baja va la cama en la primera ronda
  {% set NIVELES = [Z_BAR + EXTRA, Z_BAR] if EXTRA > 0 else [Z_BAR] %}
  {% set Z_SEGURA = [h, Z_BARRIDO]|max + 5 + FILO %}  # Z de la boquilla en los traslados
  {% set PASO = ANCHO - SOLAPE %}
  # Zona a barrer: la de las piezas (guardada por GUARDAR_ALTURA o EXCLUDE_OBJECT) + MARGEN; si no hay datos, toda la cama
  {% set b = printer["gcode_macro BARRER_CAMA"] %}
  {% set ns = namespace(x0=b.obj_x0|float, x1=b.obj_x1|float, y1=b.obj_y1|float) %}
  {% for obj in printer.exclude_object.objects %}
    {% for p in obj.polygon %}
      {% set ns.x0 = [ns.x0, p[0]|float]|min %}
      {% set ns.x1 = [ns.x1, p[0]|float]|max %}
      {% set ns.y1 = [ns.y1, p[1]|float]|max %}
    {% endfor %}
  {% endfor %}
  # Y de la boquilla al bajar: la cara de empuje queda 3 mm detrás de la pieza más al fondo
  {% if ns.y1 > -9999 %}
    {% if ns.y1 + 3 + ESP_DY > Y_MAX %}
      {action_raise_error("BARRER_CAMA: hay piezas hasta Y=%.1f; con la espátula solo se puede barrer hasta Y=%.1f. Retíralas a mano y reanuda la cola." % (ns.y1, Y_MAX - 3 - ESP_DY))}
    {% endif %}
    {% set Y_INICIO = params.Y_INICIO|default(ns.y1 + 3 + ESP_DY)|float %}
  {% else %}
    {% set Y_INICIO = params.Y_INICIO|default(Y_MAX)|float %}
  {% endif %}
  {% if ns.x1 < ns.x0 %}
    {% set ZX0, ZX1 = 0.0, 220.0 %}
  {% else %}
    {% set ZX0 = [ns.x0 - MARGEN, 0.0]|max %}
    {% set ZX1 = [ns.x1 + MARGEN, 220.0]|min %}
  {% endif %}
  # Centros de la espátula posibles: no se sale de la cama ni pasa de X_BOQ_MIN..X_BOQ_MAX
  {% set CMIN = [ANCHO / 2, X_BOQ_MIN + ESP_DX]|max %}
  {% set CMAX = [220 - ANCHO / 2, X_BOQ_MAX + ESP_DX]|min %}
  {% if ns.x1 > -9999 and ns.x1 > CMAX + ANCHO / 2 %}
    {action_raise_error("BARRER_CAMA: hay piezas hasta X=%.1f; la espátula solo llega hasta X=%.1f. Retíralas a mano y reanuda la cola." % (ns.x1, CMAX + ANCHO / 2))}
  {% endif %}
  # Centros de la primera y última pasada
  {% set XC = (ZX0 + ZX1) / 2 %}
  {% set XA = [[[ZX0 + ANCHO / 2, XC]|min, CMIN]|max, CMAX]|min %}
  {% set XB = [[[ZX1 - ANCHO / 2, XC]|max, CMIN]|max, CMAX]|min %}
  {% set N = (((XB - XA) / PASO)|round(0, 'ceil'))|int + 1 %}

  RESPOND MSG="Pieza de {h} mm: {N} pasadas entre X={XA|round(1)} y X={XB|round(1)}. Esperando a que la cama baje de {TEMP_CAMA} C"
  {% if EXTRA > 0 %}
    RESPOND MSG="Pieza alta: primera ronda con el filo a {EXTRA|round(1)} mm de la cama (para no pasar de {ALTURA_MAX} mm bajo el puente) y segunda a ras de cama"
  {% endif %}
  # En la AD5X el home de Z baja la cama hasta abajo (final de carrera en Z=220):
  # es seguro aunque haya piezas en la cama
  {% if "xyz" not in printer.toolhead.homed_axes %}
    G28
  {% endif %}
  # END_PRINT o el G28 pueden descargar la malla: se carga siempre para barrer a 0,5 mm
  BED_MESH_PROFILE LOAD={MALLA}
  G90
  M140 S0
  M106 S255
  TEMPERATURE_WAIT SENSOR=heater_bed MAXIMUM={TEMP_CAMA}
  M107
  COGER_ESPATULA Z={Z_SEGURA}

  G1 Z{Z_SEGURA} F600
  # Regla: por detrás de Y_LATERAL solo se mueve en Y (entra y sale de frente), nunca en X
  {% set YI = [Y_INICIO, Y_MAX]|min %}
  {% set YL = [YI, Y_LATERAL]|min %}
  {% for ZB in NIVELES %}
  {% for i in range(N) %}
    {% set X = [XA + i * PASO, XB]|min %}
    {% set XN = X - ESP_DX %}
    _PASADA_INI
    {% for a in range(INTENTOS) %}
      _PASADA XN={XN} YI={YI} YL={YL} ZB={ZB} ZS={Z_SEGURA} YF={Y_FINAL} VEL={VEL} TRAMO={TRAMO} UMBRAL={UMBRAL} REHOME={REHOME} REHOME_X={REHOME_X} XH={X_HOME} ESPERA={ESPERA} INTENTOS={INTENTOS}
    {% endfor %}
    _PASADA_COMPROBAR ZS={Z_SEGURA} INTENTOS={INTENTOS}
  {% endfor %}
  {% endfor %}

  DEJAR_ESPATULA Z={Z_SEGURA}
  M400
  SET_GCODE_VARIABLE MACRO=BARRER_CAMA VARIABLE=altura VALUE=-1
  SET_GCODE_VARIABLE MACRO=BARRER_CAMA VARIABLE=a_mano VALUE=0
  SET_GCODE_VARIABLE MACRO=BARRER_CAMA VARIABLE=lento VALUE=0
  SET_GCODE_VARIABLE MACRO=BARRER_CAMA VARIABLE=obj_x0 VALUE=9999
  SET_GCODE_VARIABLE MACRO=BARRER_CAMA VARIABLE=obj_x1 VALUE=-9999
  SET_GCODE_VARIABLE MACRO=BARRER_CAMA VARIABLE=obj_y1 VALUE=-9999
  SET_GCODE_VARIABLE MACRO=BARRER_CAMA VARIABLE=obj_area VALUE=0
  _BASCULA_EMPUJE FIN=1
  RESPOND MSG="Cama barrida: lista para la siguiente impresión"

# =====================================================================
#  CAMBIO DE ESPÁTULA (soporte abatible con servo, esquina delantera derecha)
#  Calibra una vez las variables de COGER_ESPATULA (ver instrucciones).
# =====================================================================

[gcode_macro COGER_ESPATULA]
description: Coge la espátula del soporte (cola de milano)
variable_dock_x: 212.5     # X de la boquilla con la espátula encajada hasta el tope (calibrar)
variable_dock_y: -3.0      # Y de la boquilla con la espátula asentada en la cuna (calibrado)
variable_recorrido: 60.0   # deslizamiento lateral para meter/sacar la cola (mín. 57)
variable_lado: -1          # -1: el cabezal sale hacia la izquierda (X-); 1: hacia la derecha
variable_retirada: 35.0    # cuánto se aleja hacia atrás del soporte
variable_z_min: 40.0       # Z mínima (cama abajo) durante el cambio
variable_vel_lenta: 900    # mm/min cerca del soporte
variable_acel: 3000        # aceleración durante el cambio (tras imprimir queda en 20000)
gcode:
  {% set v = printer["gcode_macro COGER_ESPATULA"] %}
  {% if "xyz" not in printer.toolhead.homed_axes %}
    {action_raise_error("COGER_ESPATULA: falta el home (G28)")}
  {% endif %}
  {% set z = [params.Z|default(0)|float, v.z_min, printer.toolhead.position.z]|max %}
  {% set xs = v.dock_x + v.lado * v.recorrido %}
  {% set acc = printer.toolhead.max_accel %}
  SET_VELOCITY_LIMIT ACCEL={v.acel}            # suave cerca del soporte
  G90
  G1 Z{z} F600
  G1 Y{v.dock_y + v.retirada} F6000        # detrás del soporte, fuera del giro de la puerta
  _PUERTA POS=RECTA
  _COMPROBAR_ESPATULA ESPERADO=1 PASO="antes de coger"
  G1 X{xs} F6000                           # al lado de la espátula
  G1 Y{v.dock_y} F{v.vel_lenta * 2}        # a la línea del soporte (la cola pasa por el hueco)
  G1 X{v.dock_x} F{v.vel_lenta}            # desliza: la cola entra hasta el tope
  G1 Y{v.dock_y + v.retirada} F{v.vel_lenta}   # se lleva la espátula
  M400
  _COMPROBAR_ESPATULA ESPERADO=0 PASO="después de coger"
  _PUERTA POS=PLEGADA
  SET_VELOCITY_LIMIT ACCEL={acc}

[gcode_macro DEJAR_ESPATULA]
description: Deja la espátula en el soporte
gcode:
  {% set v = printer["gcode_macro COGER_ESPATULA"] %}
  {% set z = [params.Z|default(0)|float, v.z_min, printer.toolhead.position.z]|max %}
  {% set xs = v.dock_x + v.lado * v.recorrido %}
  {% set acc = printer.toolhead.max_accel %}
  SET_VELOCITY_LIMIT ACCEL={v.acel}            # suave cerca del soporte
  G90
  G1 Z{z} F600
  G1 Y{v.dock_y + v.retirada} F6000        # detrás del soporte, fuera del giro de la puerta
  _PUERTA POS=RECTA
  G1 X{v.dock_x} F6000                     # alineado con la cuna
  G1 Y{v.dock_y} F{v.vel_lenta}            # entra en la cuna (la sujetan los imanes)
  G1 X{xs} F{v.vel_lenta}                  # desliza: saca la cola
  G1 Y{v.dock_y + v.retirada} F6000        # se aleja sin la espátula
  M400
  _COMPROBAR_ESPATULA ESPERADO=1 PASO="después de dejar"
  _PUERTA POS=PLEGADA
  SET_VELOCITY_LIMIT ACCEL={acc}

[gcode_macro _PUERTA]
description: Pone la puerta del soporte recta (coger/dejar) o plegada (imprimir/barrer)
variable_servo: "puerta"   # nombre del [servo] en Klipper; vacío = soporte fijo
variable_angulo_recta: 76  # ángulo del servo con la puerta recta (coger/dejar), calibrado
variable_angulo_plegada: 180 # ángulo del servo con la puerta plegada (abierta), calibrado
variable_espera: 700       # ms que tarda en girar
gcode:
  {% set v = printer["gcode_macro _PUERTA"] %}
  {% if v.servo %}
    {% set recta = params.POS|default("PLEGADA")|upper == "RECTA" %}
    M400
    SET_SERVO SERVO={v.servo} ANGLE={v.angulo_recta if recta else v.angulo_plegada}
    G4 P{v.espera}
    {% if not recta %}
      SET_SERVO SERVO={v.servo} WIDTH=0    # plegada: suelta el servo (no zumba)
    {% endif %}
  {% endif %}

[gcode_macro _COMPROBAR_ESPATULA]
description: Comprueba con el sensor Hall si la espátula está en el soporte
variable_sensor: ""        # p. ej. "gcode_button espatula"; vacío = sin sensor
gcode:
  {% set s = printer["gcode_macro _COMPROBAR_ESPATULA"].sensor %}
  {% if s %}
    {% set en_soporte = printer[s].state == "PRESSED" %}
    {% if en_soporte != (params.ESPERADO|int == 1) %}
      {action_raise_error("Espátula: fallo %s (en el soporte: %s). Revisa el soporte antes de seguir." % (params.PASO|default(""), en_soporte))}
    {% endif %}
  {% endif %}
[gcode_macro _PASADA_INI]
variable_hecho: 0
variable_atasco: 0
variable_intentos: 0
gcode:
  SET_GCODE_VARIABLE MACRO=_PASADA_INI VARIABLE=hecho VALUE=0
  SET_GCODE_VARIABLE MACRO=_PASADA_INI VARIABLE=atasco VALUE=0
  SET_GCODE_VARIABLE MACRO=_PASADA_INI VARIABLE=intentos VALUE=0

[gcode_macro _PASADA]
description: Una pasada de la espátula (se salta si la franja ya está limpia)
gcode:
  {% set st = printer["gcode_macro _PASADA_INI"] %}
  {% if not st.hecho %}
    {% set YI = params.YI|float %}
    {% set YF = params.YF|float %}
    {% set TR = params.TRAMO|float %}
    {% if st.intentos > 0 %}
      RESPOND MSG="Pieza pegada: reintento {st.intentos + 1} de {params.INTENTOS} dentro de {(params.ESPERA|int / 60)|round(1)} min"
      M106 S255
      G4 P{params.ESPERA|int * 1000}
      M107
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_PASADA_INI VARIABLE=atasco VALUE=0
    G1 Y{params.YL} F6000                    # a la zona donde se puede mover en X
    G1 X{params.XN} F6000                    # cambio de franja (por encima de las piezas)
    G1 Y{YI} F3000                           # entra de frente detrás de las piezas
    G1 Z{params.ZB} F300
    M400
    _BASCULA_EMPUJE BASE=1
    {% set NT = ((YI - YF) / TR)|round(0, 'ceil')|int %}
    {% for k in range(1, NT + 1) %}
      _TRAMO Y={[YI - k * TR, YF]|max} VEL={params.VEL} UMBRAL={params.UMBRAL} ZS={params.ZS}
    {% endfor %}
    _PASADA_FIN ZS={params.ZS} YL={params.YL} XN={params.XN} XH={params.XH} REHOME={params.REHOME} REHOME_X={params.REHOME_X}
  {% endif %}

[gcode_macro _TRAMO]
description: Empuja un tramo y lee la báscula (no hace nada si ya hay atasco)
gcode:
  {% if not printer["gcode_macro _PASADA_INI"].atasco %}
    G1 Y{params.Y} F{params.VEL}             # empuja
    M400
    _BASCULA_EMPUJE UMBRAL={params.UMBRAL} ZS={params.ZS}
  {% endif %}

[gcode_macro _PASADA_FIN]
gcode:
  {% set st = printer["gcode_macro _PASADA_INI"] %}
  G1 Z{params.ZS} F600
  G1 Y{params.YL} F6000                      # vuelve por la franja
  {% if params.REHOME|int %}
    # recupera los pasos que se hayan perdido al empujar, lejos de la palanca de la papelera
    G1 X{[params.XN|float, params.XH|float]|max} F6000
    G28.1 Y
    {% if params.REHOME_X|int %}
      G28.1 X
    {% endif %}
    G1 Y{params.YL} F6000
  {% endif %}
  {% if st.atasco %}
    SET_GCODE_VARIABLE MACRO=_PASADA_INI VARIABLE=intentos VALUE={st.intentos + 1}
  {% else %}
    SET_GCODE_VARIABLE MACRO=_PASADA_INI VARIABLE=hecho VALUE=1
  {% endif %}

[gcode_macro _PASADA_COMPROBAR]
gcode:
  {% if not printer["gcode_macro _PASADA_INI"].hecho %}
    RESPOND MSG="La pieza sigue pegada tras {params.INTENTOS} intentos: dejo la espátula y pauso la cola"
    DEJAR_ESPATULA Z={params.ZS}
    _ATASCO_FINAL
  {% endif %}

[gcode_macro _ATASCO_FINAL]
gcode:
  {action_raise_error("BARRER_CAMA: la pieza no se despega. Retírala a mano y reanuda la cola.")}

[gcode_macro _BASCULA_CONFIRMAR]
description: Segunda lectura tras un pico: decide si es atasco o la pieza soltándose
variable_espera: 4000      # ms quieto antes de volver a leer (la báscula tarda en actualizarse)
gcode:
  {% set w = printer["temperature_sensor weightValue"].temperature|float %}
  {% set d = w - printer["gcode_macro _BASCULA_EMPUJE"].base %}
  {% if d > params.UMBRAL|float %}
    G1 Z{params.ZS|float} F600               # levanta la espátula
    SET_GCODE_VARIABLE MACRO=_PASADA_INI VARIABLE=atasco VALUE=1
    RESPOND MSG="Atasco: la báscula sigue en +{d} tras esperar: la pieza sigue pegada"
  {% else %}
    RESPOND MSG="Pico al empujar, pero la báscula ha vuelto a +{d}: la pieza se ha soltado, sigo"
  {% endif %}

[gcode_macro _BASCULA_EMPUJE]
description: Lee la báscula durante el empuje; si sube más de UMBRAL, levanta y pausa
variable_base: 0.0
variable_maximo: 0.0
gcode:
  {% set v = printer["gcode_macro _BASCULA_EMPUJE"] %}
  {% set w = printer["temperature_sensor weightValue"].temperature|float %}
  {% if params.BASE is defined %}
    SET_GCODE_VARIABLE MACRO=_BASCULA_EMPUJE VARIABLE=base VALUE={w}
    SET_GCODE_VARIABLE MACRO=_BASCULA_EMPUJE VARIABLE=maximo VALUE=0
  {% elif params.FIN is defined %}
    RESPOND MSG="Báscula: subida máxima durante el empuje {v.maximo}"
  {% else %}
    {% set d = w - v.base %}
    {% set u = params.UMBRAL|default(0)|float %}
    SET_GCODE_VARIABLE MACRO=_BASCULA_EMPUJE VARIABLE=maximo VALUE={[v.maximo, d]|max}
    RESPOND MSG="empuje Y={printer.toolhead.position.y|round(1)} báscula {w} ({'+' if d >= 0 else ''}{d})"
    {% if u > 0 and d > u %}
      # Pico de fuerza: puede ser la pieza soltándose. Se queda quieto y vuelve a medir:
      # si sigue alta, la pieza sigue pegada; si baja, se ha despegado y sigue empujando.
      G4 P{printer["gcode_macro _BASCULA_CONFIRMAR"].espera}
      _BASCULA_CONFIRMAR UMBRAL={u} ZS={params.ZS|default(40)}
    {% endif %}
  {% endif %}

# =====================================================================
#  BAJAR LA CAMA AL FINAL DE LA IMPRESIÓN
#  Orca escribe "M73 P<porcentaje> R<minutos que faltan>" durante la
#  impresión. Cuando ya va por más del 50 % y faltan 10 min o menos,
#  baja la cama un % (una sola vez): llega antes a la temperatura de
#  barrido y la pieza se despega mejor.
# =====================================================================
[gcode_macro M73]
rename_existing: M73.1
variable_bajada: 25        # % que baja la cama (80 C -> 60 C; 65 C -> 49 C); 0 = desactivado
variable_minutos: 10       # cuando falten estos minutos o menos...
variable_porcentaje: 50    # ...y ya vaya por encima de este porcentaje
variable_hecho: 0
gcode:
  {% set v = printer["gcode_macro M73"] %}
  {% if params.P is defined %}
    M73.1 P{params.P}
    {% set pc = params.P|float %}
    {% if pc < 5 %}
      SET_GCODE_VARIABLE MACRO=M73 VARIABLE=hecho VALUE=0
    {% elif params.R is defined and not v.hecho and v.bajada > 0 %}
      {% set objetivo = printer.heater_bed.target|float %}
      {% set nueva = (objetivo * (100 - v.bajada) / 100)|round(0) %}
      {% if pc > v.porcentaje and params.R|float <= v.minutos and objetivo > 0 %}
        M140 S{nueva}
        SET_GCODE_VARIABLE MACRO=M73 VARIABLE=hecho VALUE=1
        RESPOND MSG="Faltan {params.R} min ({pc|int} %): cama de {objetivo|int} a {nueva|int} C (-{v.bajada} %)"
      {% endif %}
    {% endif %}
  {% else %}
    M73.1
  {% endif %}

# =====================================================================
#  DESVÍO DE ZMOD: con la espátula aparcada en Y -3, los recorridos de
#  ZMOD por el borde delantero (Y 0) la enganchan en la esquina derecha.
#  Se mueve ese borde a Y 4. ZMOD lo usa en cambios de color, papelera,
#  corte y vuelta a la pieza. Este archivo se carga después de ZMOD, así
#  que este valor sustituye al suyo (0.0) sin tocar sus macros.
# =====================================================================
[gcode_macro _CLIENT_VARIABLE]
variable_min_y: 4.0

# =====================================================================
#  PRUEBAS
# =====================================================================
[gcode_macro TEST_BASCULA]
description: Lee la báscula de la cama N veces cada P ms y da mínimo, máximo y media
gcode:
  {% set n = params.N|default(20)|int %}
  {% set p = params.P|default(1000)|int %}
  SET_GCODE_VARIABLE MACRO=_BASCULA_MUESTRA VARIABLE=mn VALUE=999999
  SET_GCODE_VARIABLE MACRO=_BASCULA_MUESTRA VARIABLE=mx VALUE=-999999
  SET_GCODE_VARIABLE MACRO=_BASCULA_MUESTRA VARIABLE=suma VALUE=0
  SET_GCODE_VARIABLE MACRO=_BASCULA_MUESTRA VARIABLE=k VALUE=0
  RESPOND MSG="TEST_BASCULA: {n} lecturas cada {p} ms. No toques la impresora salvo para la prueba."
  {% for i in range(n) %}
    G4 P{p}
    _BASCULA_MUESTRA
  {% endfor %}
  _BASCULA_RESUMEN

[gcode_macro _BASCULA_MUESTRA]
variable_mn: 999999.0
variable_mx: -999999.0
variable_suma: 0.0
variable_k: 0
gcode:
  {% set v = printer["gcode_macro _BASCULA_MUESTRA"] %}
  {% set w = printer["temperature_sensor weightValue"].temperature|float %}
  SET_GCODE_VARIABLE MACRO=_BASCULA_MUESTRA VARIABLE=mn VALUE={[v.mn, w]|min}
  SET_GCODE_VARIABLE MACRO=_BASCULA_MUESTRA VARIABLE=mx VALUE={[v.mx, w]|max}
  SET_GCODE_VARIABLE MACRO=_BASCULA_MUESTRA VARIABLE=suma VALUE={v.suma + w}
  SET_GCODE_VARIABLE MACRO=_BASCULA_MUESTRA VARIABLE=k VALUE={v.k + 1}
  RESPOND MSG="báscula: {w}"

[gcode_macro _BASCULA_RESUMEN]
gcode:
  {% set v = printer["gcode_macro _BASCULA_MUESTRA"] %}
  RESPOND MSG="TEST_BASCULA: mínimo {v.mn}, máximo {v.mx}, media {(v.suma / [v.k, 1]|max)|round(1)} ({v.k} lecturas)"

[gcode_macro TEST_HOME_ESPATULA]
description: Con la espátula puesta, hace home de Y y de X despacio para ver que no roza
gcode:
  {% if "xyz" not in printer.toolhead.homed_axes %}
    {action_raise_error("TEST_HOME_ESPATULA: haz primero G28")}
  {% endif %}
  G90
  G1 Z{[printer.toolhead.position.z, 40]|max} F600
  G1 X110 Y150 F6000
  RESPOND MSG="Home de Y con la espátula..."
  G28.1 Y
  RESPOND MSG="Home de X con la espátula (mira el lado derecho)..."
  G28.1 X
  G1 X110 Y150 F6000
  RESPOND MSG="TEST_HOME_ESPATULA terminado"
