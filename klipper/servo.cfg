# =====================================================================
#  ad5x-barrido-cama · servo.cfg
#  Autor: cheny3d · https://www.instagram.com/cheny3d/
#  Arduino Uno como segunda placa de Klipper: servo de la puerta
#  del soporte de la espátula (y opcionalmente el sensor Hall).
#  Firmware: firmware/klipper_uno_v0.12.0.hex (ver README.md)
#
#  Si desconectas el Uno, comenta [mcu uno] y [servo puerta]:
#  sin el Uno Klipper no arranca.
# =====================================================================

[mcu uno]
serial: /dev/ttyUSB0       # Uno clon con CH340; un Uno original (ATmega16U2) suele ser /dev/ttyACM0
baud: 250000
restart_method: arduino

[servo puerta]
pin: uno:PB1               # pin D9 del Uno
maximum_servo_angle: 180
minimum_pulse_width: 0.0005
maximum_pulse_width: 0.0025
initial_angle: 180         # al arrancar Klipper: puerta plegada

# Sensor Hall A3144 de la espátula en el soporte (cuando lo montes):
#[gcode_button espatula]
#pin: ^uno:PD2             # pin D2 del Uno, con pull-up
#press_gcode:
#release_gcode:
