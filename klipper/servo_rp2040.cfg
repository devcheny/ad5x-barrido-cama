# =====================================================================
#  ad5x-barrido-cama · servo_rp2040.cfg
#  Autor: cheny3d · https://www.instagram.com/cheny3d/
#  RP2040-Zero (Waveshare) como segunda placa de Klipper: servo de la
#  puerta del soporte de la espátula (y opcionalmente el sensor Hall).
#  Alternativa a servo.cfg (Arduino Uno): incluye solo uno de los dos.
#  Firmware: firmware/klipper_rp2040zero_v0.12.0.uf2 (ver README.md)
#
#  Si desconectas la placa, comenta [mcu rp] y [servo puerta]:
#  sin ella Klipper no arranca.
# =====================================================================

[mcu rp]
serial: /dev/ttyACM0       # mejor /dev/serial/by-id/usb-Klipper_rp2040_...-if00 si existe
restart_method: command

[servo puerta]
pin: rp:gpio29             # pin GP29 (junto a 5V, GND y 3V3)
maximum_servo_angle: 180
minimum_pulse_width: 0.0005
maximum_pulse_width: 0.0025
initial_angle: 180         # al arrancar Klipper: puerta plegada

# Sensor Hall A3144 de la espátula en el soporte (cuando lo montes).
# VCC a 5V (el A3144 necesita 4,5 V o más), GND a GND y OUT a GP28.
# La salida es de colector abierto: con el pull-up interno da 3,3 V, seguro para el RP2040.
#[gcode_button espatula]
#pin: ^rp:gpio28
#press_gcode:
#release_gcode:
